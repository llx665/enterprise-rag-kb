# 生产 Nginx 配置：前端 SPA 静态托管 + /api 反向代理（SSE 关闭缓冲）
server {
    listen 80;
    server_name _;

    # 上传文件大小上限（与后端 MAX_UPLOAD_SIZE_MB 一致）
    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- 前端 SPA ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ---------- API 反向代理 ----------
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式问答：必须关闭缓冲，保证逐字实时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------- MCP（Streamable HTTP）反向代理（可选） ----------
    # 云端远程访问 MCP 时启用：需在容器内以 --transport http 启动 MCP 服务（端口 8001）。
    # 注意：1.6G 小机额外进程会二次加载向量模型，可能触发内存紧张；建议本地 stdio 使用为主。
    # location /mcp {
    #     proxy_pass http://backend:8001;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_buffering off;
    #     proxy_cache off;
    #     proxy_read_timeout 300s;
    # }
}

# ---------- HTTPS（可选）----------
