# ==========================================================
# 生产部署：Qdrant + 后端 + Nginx（前端静态托管 + API 反代）
#
# 内存约束（服务器仅 1.6G）：省去 PostgreSQL / Redis 容器
#   - 数据用 SQLite（单实例足够，架构上可随时切 PostgreSQL）
#   - 语义缓存/限流降级为进程内存实现
#   - Qdrant 向量库保留（生产核心组件）
# 访问：http://<服务器IP>:8083
# ==========================================================
services:
  # ---------- 向量数据库 ----------
  qdrant:
    image: docker.m.daocloud.io/qdrant/qdrant:v1.19.0
    restart: unless-stopped
    mem_limit: 384m
    volumes:
      - ./qdrant_data:/qdrant/storage
    # 仅内网访问，不暴露公网端口
    networks:
      - rag_net

  # ---------- 后端 API ----------
  backend:
    build:
      context: .              # /opt/rag-kb（含 backend/ scripts/ 等）
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    mem_limit: 768m
    env_file: .env.production
    environment:
      # 容器内网地址，覆盖 .env.production 中的默认值
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data:/data              # SQLite + 上传文件
      - ./models:/models          # bge 向量模型（首次启动自动下载）
    depends_on:
      - qdrant
    # 不暴露公网，仅 nginx 反代
    networks:
      - rag_net

  # ---------- Nginx：前端静态 + API 反向代理 ----------
  nginx:
    image: docker.m.daocloud.io/library/nginx:alpine
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "8083:80"
    volumes:
      - ./frontend_dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - rag_net

networks:
  rag_net:
    driver: bridge
